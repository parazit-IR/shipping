name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Shipping.slnx
      - name: Build
        run: dotnet build Shipping.slnx -c Release --no-restore
      - name: Unit, architecture and PostgreSQL integration tests
        run: dotnet test Shipping.slnx -c Release --no-build --logger 'console;verbosity=normal'
